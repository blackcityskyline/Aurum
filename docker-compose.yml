services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AURUM_POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${AURUM_POSTGRES_PASSWORD:-aurum}
      POSTGRES_DB: ${AURUM_POSTGRES_DB:-aurum}
    volumes:
      - aurum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AURUM_POSTGRES_USER:-aurum}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AURUM_POSTGRES_USER: ${AURUM_POSTGRES_USER:-aurum}
      AURUM_POSTGRES_PASSWORD: ${AURUM_POSTGRES_PASSWORD:-aurum}
      AURUM_POSTGRES_DB: ${AURUM_POSTGRES_DB:-aurum}
      AURUM_POSTGRES_HOST: db
      AURUM_POSTGRES_PORT: 5432
      AURUM_CORS_ORIGINS: ${AURUM_CORS_ORIGINS:-}
      AURUM_DEFAULT_CURRENCY: ${AURUM_DEFAULT_CURRENCY:-USD}
      AURUM_COINGECKO_API_KEY: ${AURUM_COINGECKO_API_KEY:-}
      # Chat / AI agent
      # provider: stub | opencode | openai_compatible
      AURUM_LLM_PROVIDER: ${AURUM_LLM_PROVIDER:-opencode}
      # opencode harness (provider=opencode): address of opencode serve
      # (via socat on Docker gateway, see socat-opencode.service)
      AURUM_OPENCODE_URL: ${AURUM_OPENCODE_URL:-http://host.docker.internal:4096}
      # openai_compatible (provider=openai_compatible): any OpenAI-compatible API
      # e.g. OpenRouter: AURUM_LLM_BASE_URL=https://openrouter.ai/api/v1
      AURUM_LLM_BASE_URL: ${AURUM_LLM_BASE_URL:-}
      AURUM_LLM_API_KEY: ${AURUM_LLM_API_KEY:-}
      AURUM_LLM_MODEL: ${AURUM_LLM_MODEL:-}
      AURUM_LLM_MAX_TOKENS: ${AURUM_LLM_MAX_TOKENS:-2048}
      AURUM_LLM_TEMPERATURE: ${AURUM_LLM_TEMPERATURE:-0.7}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${AURUM_WEB_PORT:-3000}:80"
    environment:
      # Both unset = no login screen at all. See frontend/docker-entrypoint.d/20-basic-auth.sh.
      AURUM_BASIC_AUTH_USER: ${AURUM_BASIC_AUTH_USER:-}
      AURUM_BASIC_AUTH_PASSWORD: ${AURUM_BASIC_AUTH_PASSWORD:-}
    depends_on:
      - backend

volumes:
  aurum_pgdata:
